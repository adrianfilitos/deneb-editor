name: Build Nova (Windows / macOS / Linux)

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            artifact: Nova-*.exe
          - os: macos-latest
            target: --mac
            artifact: Nova-*.dmg
          - os: ubuntu-latest
            target: --linux
            artifact: Nova-*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Typecheck + tests
        run: |
          npm run typecheck
          node scripts/run-ext-test.mjs
          node scripts/run-ext-test.mjs debugger.ts
          node scripts/run-ext-test.mjs debugger-e2e.ts
          node scripts/run-ext-test.mjs debugger-cdp.ts
          node scripts/run-ext-test.mjs debugger-dap.ts
          node scripts/run-ext-test.mjs lsp.ts

      - name: Build app
        run: npm run build

      - name: Package (${{ matrix.os }})
        run: npx electron-builder ${{ matrix.target }} --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nova-${{ matrix.os }}
          path: |
            release/${{ matrix.artifact }}
            release/latest*.yml

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/*
          generate_release_notes: true
